[package]
name = "tapkacraft-launcher"
version = "0.1.0"
description = "TapkaCraft Launcher - an independent Minecraft launcher"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "tapkacraft_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
